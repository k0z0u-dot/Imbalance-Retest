[project]
name = "imbalance-retest-zone"
version = "0.1.0"
description = "Research module for OFI Memory Zone / Imbalance-Retest Zone studies."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: slower tests that run full study, sweep, or report pipelines",
]

[tool.ruff]
line-length = 100
