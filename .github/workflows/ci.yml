name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Handoff and tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "pandas>=2.0" "pytest>=8.0"

      - name: Quick handoff check
        run: python -m scripts.check_handoff

      - name: Full pytest
        run: python -m pytest

      - name: Batch runner smoke
        run: |
          python -m scripts.run_ofi_experiment_batch \
            --input data/ofi_synthetic.csv \
            --output-root output/ci_ofi_batch \
            --config configs/ofi_loose.json
