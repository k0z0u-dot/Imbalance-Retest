name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quick-handoff:
    name: Quick handoff check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "pandas>=2.0" "pytest>=8.0"

      - name: Run quick handoff check
        run: python -m scripts.check_handoff

  full-pytest:
    name: Full pytest
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "pandas>=2.0" "pytest>=8.0"

      - name: Run full pytest with durations
        run: python -m pytest --durations=20

  batch-smoke:
    name: Batch runner smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy>=1.24" "pandas>=2.0" "pytest>=8.0"

      - name: Run batch runner smoke
        run: |
          python -m scripts.run_ofi_experiment_batch \
            --input data/ofi_synthetic.csv \
            --output-root output/ci_ofi_batch \
            --config configs/ofi_loose.json
